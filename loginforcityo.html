<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Your Website</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #3498db;
            --text-color: #333;
            --bg-color: #f5f8ff;
            --container-bg: #fff;
            --border-color: #e0e0e0;
            --shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            --input-focus: #4a6cf7;
        }

        .dark-mode {
            --primary-color: #3498db;
            --text-color: #f5f5f5;
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --border-color: #444;
            --shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            --input-focus: #6c87ff;
        }

        [dir="rtl"] {
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
            padding: 20px;
        }

        .container {
            background-color: var(--container-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 420px;
            padding: 35px;
            transition: background-color 0.3s;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            font-weight: 700;
            color: var(--primary-color);
            font-size: 28px;
        }

        .logo p {
            color: #777;
            margin-top: 8px;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        [dir="rtl"] .input-with-icon i {
            left: auto;
            right: 15px;
        }

        .input-with-icon input {
            padding-left: 45px;
        }

        [dir="rtl"] .input-with-icon input {
            padding-left: 15px;
            padding-right: 45px;
        }

        .form-control {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            transition: border 0.3s;
            background-color: var(--container-bg);
            color: var(--text-color);
        }

        .form-control:focus {
            border-color: var(--input-focus);
            outline: none;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
        }

        [dir="rtl"] .toggle-password {
            right: auto;
            left: 15px;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        [dir="rtl"] .options {
            flex-direction: row-reverse;
        }

        .remember-me {
            display: flex;
            align-items: center;
        }

        [dir="rtl"] .remember-me {
            flex-direction: row-reverse;
        }

        .remember-me input {
            margin-right: 8px;
        }

        [dir="rtl"] .remember-me input {
            margin-right: 0;
            margin-left: 8px;
        }

        .forgot-password {
            color: var(--primary-color);
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #2982bd;
        }

        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #777;
            font-size: 14px;
        }

        .separator::before,
        .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .separator:not(:empty)::before {
            margin-right: .75em;
        }

        .separator:not(:empty)::after {
            margin-left: .75em;
        }

        [dir="rtl"] .separator:not(:empty)::before {
            margin-right: 0;
            margin-left: .75em;
        }

        [dir="rtl"] .separator:not(:empty)::after {
            margin-left: 0;
            margin-right: .75em;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .social-btn:hover {
            background-color: #f5f5f5;
        }

        .dark-mode .social-btn:hover {
            background-color: #2a2a2a;
        }

        .signup-link {
            text-align: center;
            font-size: 15px;
        }

        .signup-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            z-index: 10;
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        /* Enhanced Language Selector */
        .language-selector {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .language-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: var(--shadow);
            font-size: 14px;
            font-weight: 500;
        }

        .language-btn:hover {
            background-color: rgba(52, 152, 219, 0.1);
        }

        .language-btn i {
            font-size: 18px;
            transition: transform 0.3s;
        }

        .language-btn.active i {
            transform: rotate(180deg);
        }

        .language-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            width: 200px;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-top: 5px;
            box-shadow: var(--shadow);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s;
            z-index: 100;
        }

        .language-dropdown.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .language-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .language-option:first-child {
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }

        .language-option:last-child {
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .language-option:hover {
            background-color: rgba(52, 152, 219, 0.1);
        }

        .language-option.active {
            background-color: rgba(52, 152, 219, 0.15);
            font-weight: 600;
        }

        .language-flag {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        .language-name {
            flex: 1;
            font-size: 14px;
        }

        .language-check {
            color: var(--primary-color);
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .language-option.active .language-check {
            opacity: 1;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }
            
            .options {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            [dir="rtl"] .options {
                align-items: flex-end;
            }
            
            .theme-toggle {
                top: 10px;
                right: 10px;
                width: 40px;
                height: 40px;
            }
            
            .language-selector {
                top: 10px;
                left: 10px;
            }
            
            .language-btn {
                padding: 8px 12px;
                font-size: 12px;
            }
            
            .language-dropdown {
                width: 180px;
            }
        }
    </style>
</head>
<body>
    <!-- Enhanced Language Selector -->
    <div class="language-selector" id="languageSelector">
        <div class="language-btn" id="languageBtn">
            <i class="fas fa-globe"></i>
            <span id="currentLanguage">English</span>

        </div>
        <div class="language-dropdown" id="languageDropdown">
            <div class="language-option active" data-lang="en">
                <img src="https://flagcdn.com/w40/gb.png" srcset="https://flagcdn.com/w80/gb.png 2x" width="40" alt="English" class="language-flag">
                <span class="language-name">English</span>
                <i class="fas fa-check language-check"></i>
            </div>
            <div class="language-option" data-lang="hi">

                <span class="language-name">हिन्दी (Hindi)</span>
                <i class="fas fa-check language-check"></i>
            </div>
            <div class="language-option" data-lang="te">
                <img src="https://flagcdn.com/w40/in.png" srcset="https://flagcdn.com/w80/in.png 2x" width="40" alt="Telugu" class="language-flag">
                <span class="language-name">తెలుగు (Telugu)</span>
                <i class="fas fa-check language-check"></i>
            </div>
            <div class="language-option" data-lang="ta">
                <img src="https://flagcdn.com/w40/in.png" srcset="https://flagcdn.com/w80/in.png 2x" width="40" alt="Tamil" class="language-flag">
                <span class="language-name">தமிழ் (Tamil)</span>
                <i class="fas fa-check language-check"></i>
            </div>
            <div class="language-option" data-lang="ml">
                <img src="https://flagcdn.com/w40/in.png" srcset="https://flagcdn.com/w80/in.png 2x" width="40" alt="Malayalam" class="language-flag">
                <span class="language-name">മലയാളം (Malayalam)</span>
                <i class="fas fa-check language-check"></i>
            </div>
        </div>
    </div>

    <div class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
    </div>

    <div class="container">
        <div class="logo">
            <h1 data-translate="app_name">Samadhan Setu</h1>
            <p data-translate="sign_in_message">Sign in to access your account</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email" data-translate="email_label">Email Address</label>
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" data-translate-placeholder="email_placeholder">
                </div>
                <div class="error-message" id="emailError" data-translate="email_error">Please enter a valid email address</div>
            </div>

            <div class="form-group">
                <label for="password" data-translate="password_label">Password</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" data-translate-placeholder="password_placeholder">
                    <span class="toggle-password" id="togglePassword">
                        <i class="far fa-eye"></i>
                    </span>
                </div>
                <div class="error-message" id="passwordError" data-translate="password_error">Password must be at least 8 characters</div>
            </div>

            <div class="options">
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember" data-translate="remember_me">Remember me</label>
                </div>
                <a href="#" class="forgot-password" data-translate="forgot_password">Forgot Password?</a>
            </div>

            <button type="submit" class="btn" data-translate="sign_in_button">Sign In</button>
        </form>

        <div class="separator" data-translate="or_separator">Or continue with</div>

        <div class="social-login">
            <div class="social-btn">
                <i class="fab fa-google"></i>
            </div>
            <div class="social-btn">
                <i class="fab fa-facebook-f"></i>
            </div>
            <div class="social-btn">
                <i class="fab fa-twitter"></i>
            </div>
        </div>

        <div class="signup-link">
            <span data-translate="no_account">Don't have an account?</span> <a href="http://127.0.0.1:5500/sih-frontend/signupforcityo.html"  target="_blank" data-translate="sign_up_link">Sign up</a>
        </div>
    </div>

                remember_me: "എന്നെ ഓർക്കുക",
                forgot_password: "പാസ്‌വേഡ് മറന്നോ?",
                sign_in_button: "സൈൻ ഇൻ",
                or_separator: "അല്ലെങ്കിൽ തുടരുക",

                sign_up_link: "സൈൻ അപ്പ്",
                login_success: "ലോഗിൻ വിജയകരമാണ്! തിരിച്ചുവിടുന്നു..."
            }
        };

        // Language display names
        const languageNames = {
            en: "English",
            hi: "Hindi",
            te: "Telugu",
            ta: "Tamil",
            ml: "Malayalam"
        };

        // RTL languages
        const rtlLanguages = []; // Hindi could be added here if needed

        // DOM Elements
        const themeToggle = document.getElementById('themeToggle');
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const languageBtn = document.getElementById('languageBtn');
        const languageDropdown = document.getElementById('languageDropdown');
        const currentLanguage = document.getElementById('currentLanguage');
        const languageOptions = document.querySelectorAll('.language-option');
        
        // Set initial language based on browser preference or default to English
        let currentLang = localStorage.getItem('preferredLang') || 'en';
        currentLanguage.textContent = languageNames[currentLang];
        
        // Apply RTL if needed
        if (rtlLanguages.includes(currentLang)) {
            document.documentElement.setAttribute('dir', 'rtl');
        } else {
            document.documentElement.setAttribute('dir', 'ltr');
        }

        // Theme Toggle
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
            }
        });

        // Toggle Password Visibility
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Toggle eye icon
            if (type === 'text') {
                togglePassword.innerHTML = '<i class="far fa-eye-slash"></i>';
            } else {
                togglePassword.innerHTML = '<i class="far fa-eye"></i>';
            }
        });

        // Form Validation
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let isValid = true;
            
            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(emailInput.value)) {
                emailError.style.display = 'block';
                isValid = false;
            } else {
                emailError.style.display = 'none';
            }
            
            // Password validation
            if (passwordInput.value.length < 8) {
                passwordError.style.display = 'block';
                isValid = false;
            } else {
                passwordError.style.display = 'none';
            }
            
            if (isValid) {
                // Simulate form submission
                const submitBtn = loginForm.querySelector('button');
                const originalText = submitBtn.textContent;
                submitBtn.innerHTML = translations[currentLang].sign_in_button + '...';
                submitBtn.disabled = true;
                
                setTimeout(() => {
                    alert(translations[currentLang].login_success);
                    // Redirect to the city official page after successful login
                    window.open('http://127.0.0.1:5500/sih-frontend/cityofficial.html', '_blank');
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                    loginForm.reset();
                }, 1500);
            }
        });

        // Clear error messages when user starts typing
        emailInput.addEventListener('input', () => {
            emailError.style.display = 'none';
        });

        passwordInput.addEventListener('input', () => {
            passwordError.style.display = 'none';
        });

        // Language dropdown toggle
        languageBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            languageDropdown.classList.toggle('active');
            languageBtn.classList.toggle('active');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!languageSelector.contains(e.target)) {
                languageDropdown.classList.remove('active');
                languageBtn.classList.remove('active');
            }
        });

        // Language selection
        languageOptions.forEach(option => {
            option.addEventListener('click', () => {
                const lang = option.getAttribute('data-lang');
                
                // Update active language
                languageOptions.forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
                
                // Update current language display
                currentLanguage.textContent = languageNames[lang];
                
                // Close dropdown
                languageDropdown.classList.remove('active');
                languageBtn.classList.remove('active');
                
                // Change language
                changeLanguage(lang);
            });
        });

        // Function to change language
        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('preferredLang', lang);
            
            // Apply RTL if needed
            if (rtlLanguages.includes(lang)) {
                document.documentElement.setAttribute('dir', 'rtl');
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
            }
            
            // Update all text elements
            translatePage(lang);
        }

        // Function to translate the page
        function translatePage(lang) {
            // Update all elements with data-translate attribute
            document.querySelectorAll('[data-translate]').forEach(element => {
                const key = element.getAttribute('data-translate');
                if (translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });
            
            // Update all placeholder texts
            document.querySelectorAll('[data-translate-placeholder]').forEach(element => {
                const key = element.getAttribute('data-translate-placeholder');
                if (translations[lang][key]) {
                    element.setAttribute('placeholder', translations[lang][key]);
                }
            });
            
            // Update button text
            const submitBtn = loginForm.querySelector('button');
            submitBtn.textContent = translations[lang].sign_in_button;
        }

        // Initialize translation on page load
        translatePage(currentLang);
        
        // Mark the current language as active in the dropdown
        document.querySelectorAll('.language-option').forEach(option => {
            if (option.getAttribute('data-lang') === currentLang) {
                option.classList.add('active');
            } else {
                option.classList.remove('active');
            }
        });
    </script>
</body>
</html>
